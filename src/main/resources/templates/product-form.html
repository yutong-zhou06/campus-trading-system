<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('发布商品 - 校园二手交易系统')}"></head>
<body>

<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4">
                <h4 class="mb-4" th:text="${editMode} ? '编辑商品' : '发布商品'">发布商品</h4>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="${editMode} ? @{'/products/' + ${product.id}} : @{/products}"
                      th:object="${productForm}" method="post" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">商品标题 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{title}" required maxlength="100"
                               placeholder="例如：九成新《数据结构》教材">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">售价（元） <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{price}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">原价（元，选填）</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{originalPrice}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">分类</label>
                            <select class="form-select" th:field="*{categoryId}">
                                <option value="">请选择分类</option>
                                <option th:each="c : ${categories}" th:value="${c.id}"
                                        th:text="${c.icon} + ' ' + ${c.name}">分类</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">成色</label>
                            <select class="form-select" th:field="*{conditionLevel}">
                                <option value="全新">全新</option>
                                <option value="9成新">9成新</option>
                                <option value="8成新">8成新</option>
                                <option value="7成新">7成新</option>
                                <option value="有使用痕迹">有使用痕迹</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">交易地点</label>
                            <input type="text" class="form-control" th:field="*{location}" placeholder="如：东区宿舍楼下">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">商品图片</label>
                        <input type="file" class="form-control" name="image" accept="image/*">
                        <div class="form-text">支持 jpg/png/gif/webp，最大10MB</div>
                        <div class="mt-2" th:if="${editMode and product.imageUrl != null}">
                            <img th:src="${product.imageUrl}" style="height:100px;border-radius:6px;">
                            <div class="form-text">当前图片，上传新图片将替换</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">商品描述</label>
                        <textarea class="form-control" rows="5" th:field="*{description}"
                                  placeholder="描述商品的新旧程度、使用情况、交易方式等"></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-gradient btn-lg"
                                th:text="${editMode} ? '保存修改' : '立即发布'">发布</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
