<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('注册 - 校园二手交易系统')}"></head>
<body>

<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container">
    <div class="card p-4 mx-auto" style="max-width:460px; margin-top:50px;">
        <h3 class="text-center mb-4">用户注册</h3>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <div class="mb-3">
                <label class="form-label">用户名 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" th:field="*{username}"
                       placeholder="至少3个字符" required>
            </div>
            <div class="mb-3">
                <label class="form-label">密码 <span class="text-danger">*</span></label>
                <input type="password" class="form-control" th:field="*{password}"
                       placeholder="至少6个字符" required>
            </div>
            <div class="mb-3">
                <label class="form-label">确认密码 <span class="text-danger">*</span></label>
                <input type="password" class="form-control" th:field="*{confirmPassword}"
                       placeholder="请再次输入密码" required>
            </div>
            <div class="mb-3">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="选填">
            </div>
            <div class="mb-3">
                <label class="form-label">手机号</label>
                <input type="tel" class="form-control" th:field="*{phone}" placeholder="选填">
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-gradient btn-lg">注册</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <span>已有账号？</span>
            <a th:href="@{/login}" class="text-decoration-none">立即登录</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
