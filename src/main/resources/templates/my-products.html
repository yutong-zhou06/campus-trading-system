<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('我的商品 - 校园二手交易系统')}"></head>
<body>

<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">我发布的商品</h4>
        <a th:href="@{/products/new}" class="btn btn-gradient btn-sm">+ 发布新商品</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-4">
        <div class="col-6 col-md-4 col-lg-3" th:each="p : ${products}">
            <div class="card h-100">
                <a th:href="@{'/products/' + ${p.id}}">
                    <img th:src="${p.imageUrl != null ? p.imageUrl : '/images/placeholder.svg'}"
                         class="card-img-top product-img" alt="商品图片">
                </a>
                <div class="card-body">
                    <h6 class="text-truncate" th:text="${p.title}">标题</h6>
                    <div class="text-danger fw-bold" th:text="'¥' + ${p.price}">¥0</div>
                    <span class="badge"
                          th:classappend="${p.status.name() == 'AVAILABLE'} ? 'bg-success' : (${p.status.name() == 'SOLD'} ? 'bg-secondary' : 'bg-warning')"
                          th:text="${p.status.label}">状态</span>
                    <div class="mt-3 d-flex gap-2">
                        <a th:href="@{'/products/' + ${p.id} + '/edit'}" class="btn btn-sm btn-outline-primary">编辑</a>
                        <form th:action="@{'/products/' + ${p.id} + '/delete'}" method="post"
                              onsubmit="return confirm('确定要下架该商品吗？');">
                            <button class="btn btn-sm btn-outline-danger">下架</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center text-muted py-5" th:if="${#lists.isEmpty(products)}">
        你还没有发布任何商品
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
