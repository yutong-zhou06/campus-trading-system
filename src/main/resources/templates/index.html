<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('校园二手交易系统')}"></head>
<body>

<nav th:replace="~{fragments/common :: navbar}"></nav>

<!-- 顶部横幅 -->
<div class="py-5 mb-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:#fff;">
    <div class="container text-center">
        <h1 class="display-5 fw-bold">校园二手交易系统</h1>
        <p class="lead">让闲置物品找到新主人 · 目前已上架 <strong th:text="${productCount}">0</strong> 件</p>
        <div class="mt-3">
            <a th:href="@{/products}" class="btn btn-light btn-lg">开始逛逛</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/products/new}" class="btn btn-outline-light btn-lg ms-2">发布商品</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{/register}" class="btn btn-outline-light btn-lg ms-2">立即注册</a>
        </div>
    </div>
</div>

<div class="container">
    <!-- 搜索框 -->
    <form class="row g-2 mb-4" th:action="@{/products}" method="get">
        <div class="col-md-10">
            <input type="text" name="keyword" class="form-control form-control-lg" placeholder="搜索你想要的商品，如：教材、自行车、耳机...">
        </div>
        <div class="col-md-2">
            <button class="btn btn-gradient btn-lg w-100" type="submit">搜索</button>
        </div>
    </form>

    <!-- 最新商品 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">最新发布</h4>
        <a th:href="@{/products}" class="text-decoration-none">查看全部 ></a>
    </div>

    <div class="row g-4">
        <div class="col-6 col-md-4 col-lg-3" th:each="p : ${latestProducts}">
            <a th:href="@{'/products/' + ${p.id}}" class="text-decoration-none text-dark">
                <div class="card h-100">
                    <img th:src="${p.imageUrl != null ? p.imageUrl : '/images/placeholder.svg'}"
                         class="card-img-top product-img" alt="商品图片">
                    <div class="card-body">
                        <h6 class="card-title text-truncate" th:text="${p.title}">商品标题</h6>
                        <div class="text-danger fw-bold fs-5" th:text="'¥' + ${p.price}">¥0</div>
                        <small class="text-muted" th:text="${p.location}">地点</small>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-12 text-center text-muted py-4" th:if="${#lists.isEmpty(latestProducts)}">
            还没有商品，快来发布第一件吧！
        </div>
    </div>

    <!-- 分类入口 -->
    <h4 class="mt-5 mb-3">热门分类</h4>
    <div class="row g-3">
        <div class="col-6 col-md-3" th:each="c : ${categories}">
            <a th:href="@{/products(categoryId=${c.id})}" class="text-decoration-none">
                <div class="card text-center py-3">
                    <div style="font-size:2rem;" th:text="${c.icon}">📦</div>
                    <div class="fw-semibold text-dark" th:text="${c.name}">分类</div>
                </div>
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
