<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 校园二手交易系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .password-card {
            max-width: 450px;
            margin: 60px auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4192 100%);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">🎓 校园二手交易</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/}">首页</a>
                <a class="nav-link" th:href="@{/profile}">个人中心</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="nav-link btn btn-link">退出登录</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- 修改密码表单 -->
    <div class="container">
        <div class="password-card">
            <h2 class="text-center mb-4">修改密码</h2>

            <!-- 成功提示 -->
            <div th:if="${success}" class="alert alert-success" role="alert">
                <span th:text="${success}"></span>
            </div>

            <!-- 错误提示 -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/profile/password}" method="post">
                <!-- 当前密码 -->
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">当前密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="currentPassword" 
                           name="currentPassword" placeholder="请输入当前密码" required>
                </div>

                <!-- 新密码 -->
                <div class="mb-3">
                    <label for="newPassword" class="form-label">新密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="newPassword" 
                           name="newPassword" placeholder="请输入新密码（至少6个字符）" required>
                </div>

                <!-- 确认新密码 -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">确认新密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="confirmPassword" 
                           name="confirmPassword" placeholder="请再次输入新密码" required>
                </div>

                <!-- 提交按钮 -->
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">确认修改</button>
                </div>
            </form>

            <!-- 返回个人中心链接 -->
            <div class="text-center mt-3">
                <a th:href="@{/profile}" class="text-decoration-none">返回个人中心</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
