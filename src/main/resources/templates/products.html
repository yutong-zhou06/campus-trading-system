<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('商品列表 - 校园二手交易系统')}"></head>
<body>

<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container py-4">
    <!-- 搜索 + 分类筛选 -->
    <form class="row g-2 mb-4" th:action="@{/products}" method="get">
        <div class="col-md-7">
            <input type="text" name="keyword" class="form-control" th:value="${keyword}" placeholder="搜索商品关键词">
        </div>
        <div class="col-md-3">
            <select name="categoryId" class="form-select">
                <option value="">全部分类</option>
                <option th:each="c : ${categories}" th:value="${c.id}"
                        th:text="${c.icon} + ' ' + ${c.name}"
                        th:selected="${categoryId != null and categoryId == c.id}">分类</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-gradient w-100" type="submit">搜索</button>
        </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">
            共 <span th:text="${products.totalElements}">0</span> 件商品
        </h5>
        <a sec:authorize="isAuthenticated()" th:href="@{/products/new}" class="btn btn-gradient btn-sm">+ 发布商品</a>
    </div>

    <div class="row g-4">
        <div class="col-6 col-md-4 col-lg-3" th:each="p : ${products.content}">
            <a th:href="@{'/products/' + ${p.id}}" class="text-decoration-none text-dark">
                <div class="card h-100">
                    <img th:src="${p.imageUrl != null ? p.imageUrl : '/images/placeholder.svg'}"
                         class="card-img-top product-img" alt="商品图片">
                    <div class="card-body">
                        <h6 class="card-title text-truncate" th:text="${p.title}">标题</h6>
                        <div class="text-danger fw-bold fs-5" th:text="'¥' + ${p.price}">¥0</div>
                        <div class="d-flex justify-content-between">
                            <small class="text-muted" th:text="${p.conditionLevel}">成色</small>
                            <small class="text-muted" th:text="${p.location}">地点</small>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div class="text-center text-muted py-5" th:if="${products.totalElements == 0}">
        <i class="bi bi-inbox" style="font-size:3rem;"></i>
        <p class="mt-2">没有找到符合条件的商品</p>
    </div>

    <!-- 分页 -->
    <nav th:if="${products.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/products(page=${products.number - 1}, keyword=${keyword}, categoryId=${categoryId})}">上一页</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${products.number + 1} + ' / ' + ${products.totalPages}">1 / 1</span>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/products(page=${products.number + 1}, keyword=${keyword}, categoryId=${categoryId})}">下一页</a>
            </li>
        </ul>
    </nav>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
